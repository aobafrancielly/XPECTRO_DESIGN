<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Cotação | Xpectro Design</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="assets/css/cotacao.css">
    <link rel="icon" type="image/png" href="assets/images/xdicon.png">
</head>
<body>

    <header>
        <a href="index.html" class="logo-container">
            <img src="assets/images/xdicon.png" alt="XD Studio Logo" class="logo-img">
        </a>
        <a href="index.html" class="btn-voltar"><i class="fas fa-arrow-left"></i> Voltar</a>
    </header>

    <main>
        <div class="form-container">
            <h2>Vamos criar algo <span>incrível</span>?</h2>
            <p>Preencha os campos abaixo para entendermos a necessidade do seu projeto e montarmos uma cotação personalizada.</p>
            
            <form action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="3ed0bd4b-08c8-4b97-bcf8-4a21043f0e87">
                
                <div class="form-group">
                    <label for="nome">Seu Nome / Nome da Empresa</label>
                    <input type="text" id="nome" name="Nome" placeholder="Ex: João Silva" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail de Contato</label>
                    <input type="email" id="email" name="Email" placeholder="Ex: joao@empresa.com" required>
                </div>

                <div class="form-group">
                    <label for="tipo">Tipo de Projeto</label>
                    <select id="tipo" name="Tipo de Projeto" required>
                        <option value="" disabled selected>Selecione uma option...</option>
                        <option value="landing-page">Landing Page de Alta Conversão</option>
                        <option value="portfolio">Site Institucional / Portfólio</option>
                        <option value="ecommerce">Loja Virtual (E-commerce)</option>
                        <option value="ui-design">Apenas o Design da Interface (Figma)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mensagem">Descrição do que você deseja no site</label>
                    <textarea id="mensagem" name="Mensagem" placeholder="Conte um pouco sobre seu negócio, quais seções precisa e referências visuais que você gosta..." required></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Solicitação</button>
            </form>
        </div>
    </main>

</body>
</html>
